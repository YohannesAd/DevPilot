name: V1 checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: devpilot_test_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: devpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpilot_test_admin -d devpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://devpilot_test_admin:disposable-ci-only@127.0.0.1:5432/devpilot_test
      TEST_DATABASE_URL: postgresql+psycopg://devpilot_test_admin:disposable-ci-only@127.0.0.1:5432/devpilot_test
      APP_ENV: development
      FRONTEND_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:8000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Migrate disposable database from empty to head
        run: python -m alembic upgrade head
      - name: Verify revision and schema (read-only)
        run: python -m scripts.check_schema --database devpilot_test
      - name: Backend tests including downgrade and preservation checks
        run: python -m pytest tests -q
      - name: Verify schema after migration tests
        run: python -m scripts.check_schema --database devpilot_test
      - name: Audit locked dependencies in separate tooling environment
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/audit/bin/python" -m pip_audit --disable-pip --require-hashes -r requirements-dev.lock

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: React DOM simulations (not browser tests)
        run: npm test
      - name: Production build and type validation
        run: npm run build
      - name: Audit runtime and test dependencies
        run: npm audit --audit-level=moderate
